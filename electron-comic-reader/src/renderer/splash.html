<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>
/* ── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #091413;
  overflow: hidden;
  font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ── GPU layer hint ─────────────────────────────────────── */
.gpu { will-change: transform, opacity; transform: translateZ(0); }

/* ── Full-screen container ─────────────────────────────── */
#root {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  position: relative;
}

/* ── Radial vignette (CSS only, no image) ──────────────── */
#root::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 75% at 50% 50%, transparent 30%, rgba(0,0,0,0.72) 100%),
    radial-gradient(ellipse 55% 50% at 50% 50%, rgba(220,37,37,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── Subtle scan-line texture ──────────────────────────── */
#root::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.06) 2px,
    rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 0;
}

/* ── Logo wrapper ──────────────────────────────────────── */
#logo-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  /* Step 1: hidden */
  opacity: 0;
  transform: scale(0.85) translateZ(0);
  /* Step 2: reveal at 0.3s, then hand off to breathing keyframe */
  animation:
    logoReveal 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.15s forwards,
    logoBreathe 3s ease-in-out 0.65s infinite;
}

@keyframes logoReveal {
  to { opacity: 1; transform: scale(1.0) translateZ(0); }
}

@keyframes logoBreathe {
  0%, 100% { transform: scale(1.00) translateZ(0); }
  50%       { transform: scale(1.03) translateZ(0); }
}

/* ── Logo icon ─────────────────────────────────────────── */
#logo-icon {
  width: 72px; height: 72px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Outer ring */
#logo-icon::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(220,37,37,0.9) 0%, rgba(180,20,20,0.7) 100%);
  box-shadow:
    0 0 0 1px rgba(220,37,37,0.4),
    0 0 32px rgba(220,37,37,0.35),
    0 0 64px rgba(220,37,37,0.15),
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -1px 0 rgba(0,0,0,0.3);
}

/* Inner lightning / book glyph — pure CSS */
#logo-icon::after {
  content: '⚡';
  position: relative;
  font-size: 32px;
  z-index: 1;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
}

/* ── App name ──────────────────────────────────────────── */
#app-name {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  opacity: 0;
  animation: fadeUp 0.45s ease-out 0.6s forwards;
}

/* ── Version badge ─────────────────────────────────────── */
#version {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.22);
  opacity: 0;
  animation: fadeUp 0.35s ease-out 0.75s forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(4px) translateZ(0); }
  to   { opacity: 1; transform: translateY(0)   translateZ(0); }
}

/* ── Dots loader ───────────────────────────────────────── */
#dots {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  opacity: 0;
  animation: fadeUp 0.3s ease-out 0.8s forwards;
}

.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #DC2525;
  box-shadow: 0 0 6px rgba(220,37,37,0.65);
  animation: dotPulse 1.4s ease-in-out infinite;
}
.dot:nth-child(1) { animation-delay: 0s;     }
.dot:nth-child(2) { animation-delay: 0.22s;  }
.dot:nth-child(3) { animation-delay: 0.44s;  }

@keyframes dotPulse {
  0%, 100% { opacity: 0.25; transform: scale(0.8) translateZ(0); }
  50%       { opacity: 1;    transform: scale(1.2) translateZ(0); }
}

/* ── Corner accent lines ───────────────────────────────── */
.corner {
  position: absolute;
  width: 18px; height: 18px;
  opacity: 0;
  animation: fadeUp 0.4s ease-out 0.5s forwards;
}
.corner-tl { top: 16px;    left:  16px;  border-top:    1px solid rgba(220,37,37,0.4); border-left:  1px solid rgba(220,37,37,0.4); }
.corner-tr { top: 16px;    right: 16px;  border-top:    1px solid rgba(220,37,37,0.4); border-right: 1px solid rgba(220,37,37,0.4); }
.corner-bl { bottom: 16px; left:  16px;  border-bottom: 1px solid rgba(220,37,37,0.4); border-left:  1px solid rgba(220,37,37,0.4); }
.corner-br { bottom: 16px; right: 16px;  border-bottom: 1px solid rgba(220,37,37,0.4); border-right: 1px solid rgba(220,37,37,0.4); }

/* ── Shimmer bar (bottom) ──────────────────────────────── */
#shimmer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(220,37,37,0.0) 20%,
    rgba(220,37,37,0.9) 50%,
    rgba(220,37,37,0.0) 80%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: shimmerSweep 2.2s ease-in-out 0.5s infinite;
  opacity: 0.7;
}
@keyframes shimmerSweep {
  0%   { background-position: -100% 0; }
  100% { background-position:  200% 0; }
}

/* ── Exit fade (triggered by JS class) ─────────────────── */
body.fade-out {
  animation: exitFade 0.5s ease forwards;
}
@keyframes exitFade {
  to { opacity: 0; }
}
</style>
</head>
<body>
<div id="root">

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Logo + name -->
  <div id="logo-wrap" class="gpu">
    <div id="logo-icon"></div>
    <div id="app-name">Volume · Comic Reader</div>
    <div id="version">v1.0.0</div>
  </div>

  <!-- Loading dots -->
  <div id="dots">
    <div class="dot gpu"></div>
    <div class="dot gpu"></div>
    <div class="dot gpu"></div>
  </div>

  <!-- Bottom shimmer -->
  <div id="shimmer"></div>

</div>

<script>
  // Listen for the "ready" signal from the main process
  // then trigger the fade-out before the window closes.
  if (window.splashBridge) {
    window.splashBridge.onReady(() => {
      document.body.classList.add('fade-out');
    });
  }
</script>
</body>
</html>
